name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Run CI
        run: bash scripts/ci.sh

  docker:
    # ghcr.ioへはlinux/amd64とlinux/arm64を配布する(issue #94)。両方のネイティブランナーで
    # イメージがビルドできることをPRの段階で確認する。
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v4

      - name: Validate compose file
        run: docker compose config -q

      - name: Build the orchestrator image
        run: docker build -t pr-preview-orchestrator:ci .

      - name: Verify the bundled tooling and build output
        run: |
          docker run --rm --entrypoint sh pr-preview-orchestrator:ci -c '
            set -e
            node -v
            docker --version
            docker compose version --short
            docker buildx version
            git --version
            test -f /app/web/dist/index.html
            test -f /app/server/dist/index.js
          '
